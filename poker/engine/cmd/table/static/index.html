<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heads-up hold'em, 50 bb</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="table.css">
<script type="module" src="table.js"></script>
</head>
<body class="busy">
<main>
  <div id="felt">
    <div id="deck"></div>
    <div id="hand-label">Hand <span id="hand-number">&ndash;</span></div>
    <div class="seat" id="seat-bot">
      <div class="who">Bot <span class="pos" id="bot-pos"></span></div>
      <div class="stk"><b id="bot-stack"></b> <span id="bot-stackbb"></span></div>
      <div class="holds" id="bot-holds"></div>
      <div class="said" id="bot-said"></div>
    </div>
    <div class="seat" id="seat-you">
      <div class="said" id="you-said"></div>
      <div class="holds" id="you-holds"></div>
      <div class="who">You <span class="pos" id="you-pos"></span></div>
      <div class="stk"><b id="you-stack"></b> <span id="you-stackbb"></span></div>
    </div>
  </div>
  <div id="bar">
    <div id="actions"></div>
    <div id="next-wrap" hidden><span id="outcome"></span><button id="next">Next hand <kbd>N</kbd></button></div>
    <div id="error" role="alert"></div>
  </div>
</main>
<aside id="side">
  <header><h1>Heads-up no-limit hold&rsquo;em</h1><div id="blinds"></div></header>
  <section id="bot">
    <div>Bot: <b id="bot-name"></b></div>
    <div class="dim" id="bot-trained"></div>
    <div class="ex">Exploitability: <span id="exploitability"></span></div>
    <div class="dim" id="bot-note"></div>
  </section>
  <section id="stats">
    <div><span class="k">Hands</span><b id="stat-hands">0</b></div>
    <div><span class="k">Net bb</span><b id="stat-net">0</b></div>
    <div><span class="k">bb/100</span><b id="stat-bb100">&ndash;</b><small id="stat-se"></small></div>
    <div id="stat-by"></div>
  </section>
  <section id="history-wrap"><h2>Hand history</h2><div id="history"></div></section>
  <section id="controls">
    <div class="row">Seat:
      <label><input type="radio" name="seat" value="alternate" checked> alternate</label>
      <label><input type="radio" name="seat" value="sb"> button</label>
      <label><input type="radio" name="seat" value="bb"> big blind</label>
    </div>
    <div class="row">
      <label>Speed <input id="speed" type="range" min="0.5" max="2" step="0.25" value="1"> <span id="speedv">1x</span></label>
      <button id="skip" title="Finish the animation now (Esc)">Skip <kbd>Esc</kbd></button>
      <label><input id="rm" type="checkbox"> reduced motion</label>
    </div>
    <div class="row" id="opp-row" hidden>Opponent (from the next hand): <select id="opponent"></select></div>
    <div class="row"><button id="new-session">New session</button></div>
    <div class="dim small" id="menu"></div>
    <div class="dim small" id="keys">Keys: F fold, C check/call, 1&ndash;3 bet sizes, A all-in, N next hand.</div>
  </section>
</aside>
</body>
</html>
